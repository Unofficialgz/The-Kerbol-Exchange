// The Kerbol Exchange - Ore base prices and active-gameplay market settings.
// Edit while KSP is closed, then restart KSP. No DLL rebuild is required.
// BODY/name is the exact, case-sensitive CelestialBody.bodyName, not displayName.
// Add BODY entries for planet packs. Unlisted legitimate solid bodies use fallbackPrice.
// Prices apply only to verified Ore.
// Kerbin is always forced to zero by code, including if its entry is removed/changed.
// Prices must be finite, non-negative invariant numbers (decimal point '.').
// Keep exactly one OREMARKET_PRICES node and one entry per identity.
// Invalid/missing/duplicate configuration disables sales; valid cargo stays tracked.
OREMARKET_PRICES
{
    fallbackPrice = 10
    // Market time uses active gameplay seconds, not Kerbal UT.
    MARKET
    {
        intervalSeconds = 60
        minimumMultiplier = 0.65
        maximumMultiplier = 2.5
        volatility = 0.035
        momentum = 0.65
        meanReversion = 0.012
        trendStrength = 0.006
        trendMinimum = 10
        trendMaximum = 180
        historyLimit = 1440
        // Event-start chances per active minute (extreme: ONE global roll).
        ordinaryEventChance = 0.02
        significantBoomChance = 0.004
        majorBoomChance = 0.003
        extremeBoomChance = 0.0035
        maximumConcurrentEvents = 3
    }
    BODY
    {
        name = Kerbin
        price = 0
    }
    BODY
    {
        name = Minmus
        price = 30
    }
    BODY
    {
        name = Mun
        price = 40
    }
    BODY
    {
        name = Ike
        price = 65
    }
    BODY
    {
        name = Duna
        price = 75
    }
    BODY
    {
        name = Gilly
        price = 80
    }
    BODY
    {
        name = Dres
        price = 105
    }
    BODY
    {
        name = Pol
        price = 115
    }
    BODY
    {
        name = Bop
        price = 125
    }
    BODY
    {
        name = Vall
        price = 150
    }
    BODY
    {
        name = Moho
        price = 170
    }
    BODY
    {
        name = Eeloo
        price = 175
    }
    BODY
    {
        name = Laythe
        price = 190
    }
    BODY
    {
        name = Tylo
        price = 250
    }
    BODY
    {
        name = Eve
        price = 350
    }
    // All supported stock asteroid/comet classes and secondary variants share ONE market.
    // Pricing does not authorize extraction or whole-object sales.
    OBJECT
    {
        name = OreMarket:Object:SpaceRock
        price = 100
    }
}
